<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOLAPELANGI2 TOOLS</title>
<style>
:root{--bg:#0b0f14;--p:#121821;--p2:#171f2a;--l:#273242;--t:#eef2f7;--m:#93a0b2;--a:#55d6a6}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0f14,#0e141c);color:var(--t);font:14px Arial}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:20px;font-weight:800}.brand span{color:var(--a)}.muted{color:var(--m);font-size:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:14px}textarea{width:100%;min-height:170px;background:#0b1016;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:12px;font:12px monospace}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}button{border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer;background:var(--a);color:#06130e}.secondary,.tab{background:#283342;color:#fff}.tab.active{background:var(--a);color:#06130e}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}pre{white-space:pre-wrap;background:#090d12;border:1px solid var(--l);border-radius:10px;padding:12px;min-height:130px;font:12px monospace;line-height:1.55}.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat div{background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:10px}.stat b{display:block;font-size:16px;margin-top:4px}@media(max-width:600px){.stat{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap">
<div class="top"><div><div class="brand"><span>BOLAPELANGI2</span> TOOLS</div><div class="muted">Ringan • cepat • siap dikembangkan</div></div><div class="muted">Data Checker</div></div>
<div class="card"><h3>Data Checker</h3><div class="grid"><div><div class="muted">DP / Deposit History</div><textarea id="dp" placeholder="Paste seluruh data DP di sini..."></textarea></div><div><div class="muted">WD / Withdraw History</div><textarea id="wd" placeholder="Paste seluruh data WD di sini..."></textarea></div></div><p><button onclick="run()">CEK DATA</button> <button class="secondary" onclick="location.reload()">BERSIHKAN</button></p></div>
<div class="card"><div class="stat" id="stats"></div></div>
<div class="card"><div class="tabs"><button class="tab active" data-t="hasil">HASIL</button><button class="tab" data-t="DP">DP</button><button class="tab" data-t="A">SCB A</button><button class="tab" data-t="B">SCB B</button><button class="tab" data-t="C">SCB C</button><button class="tab" data-t="D">SCB D</button><button class="tab" data-t="E">SCB E</button><button class="tab" data-t="WD">WD</button></div><button class="secondary" onclick="copyCur()">COPY</button><pre id="out">Belum ada hasil.</pre></div>
<div class="card"><b>Siap dikembangkan</b><div class="muted">Struktur dibuat modular supaya pendataan member, bonus, laporan, dan tools lain bisa ditambahkan kemudian.</div></div>
</main>
<script>
let D={hasil:"",DP:[],A:[],B:[],C:[],D:[],E:[],WD:[]},cur="hasil", $=x=>document.getElementById(x);
function money(s){s=s.replace(/\*\*/g,"").trim();if(!/^[\d.,]+$/.test(s))return null;if(s.includes(",")&&s.includes("."))return +s.replace(/,/g,"");if(s.includes(",")){let p=s.split(",");return p.length==2&&p[1].length<=2?+(p[0].replace(/\./g,"")+"."+p[1]):+s.replace(/,/g,"")}if(s.includes(".")){let p=s.split(".");return p.at(-1).length==3?+s.replace(/\./g,""):+s}return +s}
function fmt(n){return new Intl.NumberFormat("en-US",{maximumFractionDigits:3}).format(n)}
function dt(s){let m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);if(!m)return null;let h=+m[4],a=(m[7]||"").toUpperCase();if(a=="PM"&&h<12)h+=12;if(a=="AM"&&h==12)h=0;return new Date(+m[3],+m[1]-1,+m[2],h,+m[5],+(m[6]||0))}
function rows(t){let o=[],c=[];for(let x of t.replace(/\r/g,"").split("\n")){x=x.trim();if(!x)continue;if(x[0]=="|"){let a=x.split("|").slice(1,-1).map(z=>z.replace(/<br\s*\/?>/gi," ").replace(/\*\*/g,"").trim());if(a.length>4&&!/^[-: ]+$/.test(a.join("")))o.push(a)}else if(/^\d+\s+BFJ@/i.test(x)){if(c.length)o.push(c);c=x.split(/\t+/).filter(Boolean)}else if(c.length)c.push(...x.split(/\t+/).filter(Boolean))}if(c.length)o.push(c);return o}
function user(s){let m=s.match(/\bBFJ@[\w.@-]+/i);return m?m[0]:""}
function parseDP(t){let o=[];for(let r of rows(t)){let j=r.join(" "),m=j.match(/\d{1,2}\/\d{1,2}\/\d{4}\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)?/i);if(!/Deposit/i.test(j)||!/Confirmed/i.test(j)||!m)continue;let b=j.slice(0,m.index).trim().split(/\s+/),a=null;for(let i=b.length-1;i>=0;i--){let v=money(b[i]);if(v!==null){a=v;break}}if(a===null)continue;let s=j.match(/\bSCB\s*([A-E])\b/i),d=dt(m[0]);o.push({u:user(j),a,d,day:`${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`,scb:s?s[1].toUpperCase():null})}return o}
function parseWD(t){let o=[];for(let r of rows(t)){let j=r.join(" "),m=j.match(/\d{1,2}\/\d{1,2}\/\d{4}\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)?/i);if(!/Withdraw/i.test(j)||!/Confirmed/i.test(j)||!m)continue;let d=dt(m[0]),q=j.slice(m.index+m[0].length).split(/Withdraw/i)[0],n=(q.match(/[\d][\d.,]*/g)||[]).map(money).filter(x=>x!==null);if(n.length>=3)o.push({u:user(j),a:n[0],bal:n[2],d})}return o}
function run(){let p=parseDP($("dp").value),w=parseWD($("wd").value),base=p.filter(x=>!x.scb),sc=p.filter(x=>x.scb),last=base.slice().sort((a,b)=>b.d-a.d)[0],nw=w.slice().sort((a,b)=>b.d-a.d)[0],td=base.reduce((s,x)=>s+x.a,0),bo=sc.reduce((s,x)=>s+x.a,0),tw=w.reduce((s,x)=>s+x.a,0),day=last?p.filter(x=>x.day==last.day).reduce((s,x)=>s+x.a,0):0,net=td-tw-bo;D.DP=base.map(x=>fmt(x.a*1000));for(let c of "ABCDE")D[c]=sc.filter(x=>x.scb==c).map(x=>fmt(x.a*1000));D.WD=w.map(x=>fmt(x.a*1000));let tm=last?last.d.toLocaleString("en-US",{month:"2-digit",day:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}):"MM/DD/YYYY 7:00:37 PM";D.hasil=`BOLAPELANGI2\n\nUSER ID : ${base[0]?.u||w[0]?.u||""}\nWD : ${nw?nw.a.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):""}\nSISA DANA AKUN : ${nw?nw.bal.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):""}\n\nLAST DP : ${last?fmt(last.a*1000):""}\n${tm}\nTOTAL DP : ${fmt(day*1000)}\n\nSTATUS MEMBER\nDP : ${fmt(td*1000)}\nWD : ${fmt(tw*1000)}\nBONUS : ${fmt(bo*1000)}\nDP-WD-BNS : ${fmt(net*1000)}\nSTATUS KITA : ${net>=0?"WIN":"LOSE"}\n\nGAMES :\nMEMBER REGISTER :`;show("hasil");$("stats").innerHTML=`<div><span class=muted>DP</span><b>${base.length}</b></div><div><span class=muted>SCB</span><b>${sc.length}</b></div><div><span class=muted>WD</span><b>${w.length}</b></div><div><span class=muted>STATUS</span><b>${net>=0?"WIN":"LOSE"}</b></div>`}
function show(t){cur=t;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.t==t));$("out").textContent=t=="hasil"?D.hasil:(D[t]||[]).join("\n")||"Tidak ada data."}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.t));async function copyCur(){let s=cur=="hasil"?D.hasil:(D[cur]||[]).join("\n");await navigator.clipboard.writeText(s)}
</script></body></html>
