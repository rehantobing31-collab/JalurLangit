<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOLAPELANGI2 TOOLS</title>
<style>
  :root{
    --bg:#0b0f14;--bg2:#0e141c;--p:#121821;--p2:#171f2a;
    --l:#273242;--l2:#314054;--t:#eef2f7;--m:#93a0b2;--m2:#5c6a7d;
    --a:#55d6a6;--a-soft:rgba(85,214,166,.10);--amber:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--t);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  .wrap{max-width:1050px;margin:auto;padding:24px 20px 60px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#55d6a6,#3fb98a);color:#06130e;font-weight:900;font-size:17px;display:grid;place-items:center}
  .brand h1{margin:0;font-size:19px;font-weight:800}
  .brand h1 span{color:var(--a)}
  .brand p{margin:2px 0 0;font-size:11.5px;color:var(--m)}
  .badge{font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;color:var(--a);background:var(--a-soft);border:1px solid rgba(85,214,166,.30)}
  .card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:20px;margin-bottom:14px}
  .card h2{margin:0 0 4px;font-size:14.5px}
  .card .sub{font-size:11.5px;color:var(--m);margin-bottom:16px}
  .muted{color:var(--m);font-size:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  textarea{width:100%;min-height:160px;background:#0b1016;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:12px;font:12px/1.55 Consolas,monospace;resize:vertical}
  textarea:focus{outline:0;border-color:var(--a)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{border:0;border-radius:10px;cursor:pointer;padding:11px 18px;font-weight:700;font-size:13px;background:var(--a);color:#06130e}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:transparent;color:var(--t);border:1px solid var(--l2)}
  button.tab{background:#283342;color:#c8d3e6;padding:8px 12px;font-size:11.5px}
  button.tab.active{background:var(--a);color:#06130e}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  pre{white-space:pre-wrap;background:#090d12;border:1px solid var(--l);border-radius:10px;padding:14px;min-height:160px;font:12px/1.6 Consolas,monospace;margin:0}
  .stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat div{background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:10px}
  .stat span{font-size:11px;color:var(--m)}
  .stat b{display:block;font-size:16px;margin-top:4px;color:var(--a)}
  @media(max-width:600px){.stat{grid-template-columns:1fr 1fr}}
  .err{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.35);color:#fca5a5;padding:10px 12px;border-radius:9px;margin-top:12px;font-size:12.5px;display:none}
  .err.show{display:block}
</style>
</head>
<body>
<main class="wrap">

  <div class="top">
    <div class="brand">
      <div class="logo">BP</div>
      <div>
        <h1><span>BOLAPELANGI2</span> TOOLS</h1>
        <p>Data Checker · Final v7</p>
      </div>
    </div>
    <span class="badge">● READY</span>
  </div>

  <div class="card">
    <h2>Data Checker</h2>
    <div class="sub">Paste Deposit History &amp; Withdraw History, lalu klik PROSES DATA.</div>
    <div class="grid">
      <div>
        <div class="muted">DATA DP / Deposit History</div>
        <textarea id="dp" placeholder="Paste seluruh tabel Deposit History di sini..."></textarea>
      </div>
      <div>
        <div class="muted">DATA WD / Withdraw History</div>
        <textarea id="wd" placeholder="Paste seluruh tabel Withdraw History di sini..."></textarea>
      </div>
    </div>
    <div class="actions">
      <button id="process">PROSES DATA</button>
      <button class="ghost" id="clear">BERSIHKAN</button>
    </div>
    <div id="error" class="err"></div>
  </div>

  <div class="card">
    <div class="stat" id="stats">
      <div><span>DP BIASA</span><b>—</b></div>
      <div><span>SCB</span><b>—</b></div>
      <div><span>WD</span><b>—</b></div>
      <div><span>STATUS</span><b>—</b></div>
    </div>
  </div>

  <div class="card">
    <div class="tabs" id="tabs">
      <button class="tab active" data-t="hasil">HASIL</button>
      <button class="tab" data-t="DP">DP</button>
      <button class="tab" data-t="A">SCB A</button>
      <button class="tab" data-t="B">SCB B</button>
      <button class="tab" data-t="C">SCB C</button>
      <button class="tab" data-t="D">SCB D</button>
      <button class="tab" data-t="E">SCB E</button>
      <button class="tab" data-t="WD">WD</button>
    </div>
    <pre id="out">Belum ada hasil.</pre>
    <div class="actions"><button class="ghost" id="copy">COPY TAB INI</button></div>
  </div>

</main>

<script>
/* ===== PARSER (sama persis dengan sidepanel.js) ===== */
const $=id=>document.getElementById(id);
function clean(s){return String(s??"").replace(/\u00a0/g," ").replace(/\\@/g,"@").replace(/\*\*/g,"").replace(/<br\s*\/?>/gi," ").trim();}
function cells(line){if(!line.includes("|"))return[];let c=line.split("|").map(clean);while(c[0]==="")c.shift();while(c.at(-1)==="")c.pop();return c;}
function dt(s){const m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);if(!m)return null;let h=+m[4],ap=(m[7]||"").toUpperCase();if(ap==="PM"&&h<12)h+=12;if(ap==="AM"&&h===12)h=0;return new Date(+m[3],+m[2]-1,+m[1],h,+m[5],+(m[6]||0));}
function fmt(n){return Math.round(n).toLocaleString("en-US")}
function displayed(n){return Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(s){return /^[-+]?\d[\d.,]*$/.test(clean(s));}
function depAmt(s){let x=clean(s).replace(/[^\d-]/g,"");if(!x||x==="-")return 0;return Number(x)||0;}
function wdAmt(s){return Number(clean(s).replace(/,/g,""))||0;}

function parseDP(text){
  const out=[];const lines=text.split(/\r?\n/);
  for(const raw of lines){
    const c=cells(raw);if(c.length<6)continue;
    const ui=c.findIndex(x=>/^BFJ@/i.test(x));if(ui<0)continue;
    const di=c.findIndex((x,i)=>i>ui&&!!dt(x));if(di<0)continue;
    const ai=di-1;if(ai<0||!num(c[ai]))continue;
    const toBank=c[ai-1]||"";
    const amount=depAmt(c[ai]);const date=dt(c[di]);if(!amount||!date)continue;
    const scb=(toBank.match(/\bSCB\s*([A-E])\b/i)||[])[1]||null;
    out.push({user:c[ui],toBank,amount,date,dateText:c[di],category:scb||"DP",raw});
  }
  if(out.length)return dedupeDP(out);
  const re=/BFJ@[\w.-]+/gi,ms=[...text.matchAll(re)];
  for(let i=0;i<ms.length;i++){
    const block=text.slice(ms[i].index,ms[i+1]?.index??text.length);
    const user=ms[i][0];
    const dates=[...block.matchAll(/(\d{1,2}\/\d{1,2}\/\d{4}\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)?)/gi)];
    if(!dates.length)continue;
    const dm=dates[0],date=dt(dm[1]);if(!date)continue;
    const before=block.slice(0,dm.index);
    const mm=[...before.matchAll(/(-?\d{1,3}(?:[.,]\d{3})+|-?\d+(?:\.\d+)?)\s*$/g)];
    if(!mm.length)continue;
    const amount=depAmt(mm.at(-1)[1]);if(!amount)continue;
    const ctx=block.slice(0,dm.index+dm[0].length+100);
    const sm=ctx.match(/\bSCB\s*([A-E])\b/i);
    out.push({user,toBank:sm?sm[0]:"",amount,date,dateText:dm[1],category:sm?sm[1]:"DP",raw:block});
  }
  return dedupeDP(out);
}
function dedupeDP(a){const s=new Set();return a.filter(x=>{const k=x.user+"|"+x.amount+"|"+x.date.getTime()+"|"+x.category;if(s.has(k))return false;s.add(k);return true;});}

function parseWD(text){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const c=cells(raw);if(c.length<9)continue;
    const ui=c.findIndex(x=>/^BFJ@/i.test(x));if(ui<0)continue;
    const di=c.findIndex((x,i)=>i>ui&&!!dt(x));if(di<0)continue;
    const wi=di+1;if(wi+2>=c.length||!num(c[wi])||!num(c[wi+1])||!num(c[wi+2]))continue;
    const date=dt(c[di]),w=wdAmt(c[wi]),old=wdAmt(c[wi+1]),bal=wdAmt(c[wi+2]);if(!date||!w)continue;
    out.push({user:c[ui],wdRaw:w,oldRaw:old,newRaw:bal,date,dateText:c[di],raw});
  }
  if(out.length)return dedupeWD(out);
  const re=/BFJ@[\w.-]+/gi,ms=[...text.matchAll(re)];
  for(let i=0;i<ms.length;i++){
    const block=text.slice(ms[i].index,ms[i+1]?.index??text.length);
    if(!/(?:Agent|Member)\s+Withdraw/i.test(block))continue;
    const dm=block.match(/(\d{1,2}\/\d{1,2}\/\d{4}\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)?)/i);
    if(!dm)continue;const date=dt(dm[1]);if(!date)continue;
    const after=block.slice((dm.index??0)+dm[0].length);
    const ns=[...after.matchAll(/(?:^|\s)(-?\d{1,3}(?:,\d{3})*(?:\.\d+)?|-?\d+(?:\.\d+)?)(?=\s|$)/g)].map(m=>m[1]);
    if(ns.length<3)continue;
    out.push({user:ms[i][0],wdRaw:wdAmt(ns[0]),oldRaw:wdAmt(ns[1]),newRaw:wdAmt(ns[2]),date,dateText:dm[1],raw:block});
  }
  return dedupeWD(out);
}
function dedupeWD(a){const s=new Set();return a.filter(x=>{const k=x.user+"|"+x.wdRaw+"|"+x.date.getTime();if(s.has(k))return false;s.add(k);return true;});}
function categoryTotal(rows,cat){return rows.filter(x=>x.category===cat).reduce((s,x)=>s+x.amount,0);}

/* ===== STATE ===== */
let DATA={hasil:"",DP:[],A:[],B:[],C:[],D:[],E:[],WD:[]},cur="hasil";
let COPY={DP:[],A:[],B:[],C:[],D:[],E:[],WD:[]};  // <-- nominal only

/* ===== PROCESS ===== */
function processData(){
  $("error").classList.remove("show");
  const dp=parseDP($("dp").value),wd=parseWD($("wd").value);
  if(!dp.length)throw Error("DP belum terbaca. Paste seluruh Deposit History.");
  if(!wd.length)throw Error("WD belum terbaca. Paste seluruh Withdraw History.");

  const user=dp[0].user;
  const d=dp.filter(x=>x.user===user),w=wd.filter(x=>x.user===user);
  if(!w.length)throw Error("WD untuk USER ID "+user+" belum terbaca.");

  const ordinary=d.filter(x=>x.category==="DP");
  const A=d.filter(x=>x.category==="A"),B=d.filter(x=>x.category==="B"),C=d.filter(x=>x.category==="C"),D=d.filter(x=>x.category==="D"),E=d.filter(x=>x.category==="E");

  const totalDP=ordinary.reduce((s,x)=>s+x.amount,0);
  const bonus=categoryTotal(d,"A")+categoryTotal(d,"B")+categoryTotal(d,"C")+categoryTotal(d,"D")+categoryTotal(d,"E");

  const lastDP=ordinary.slice().sort((a,b)=>b.date-a.date)[0];
  if(!lastDP)throw Error("Tidak ditemukan DP biasa.");

  const y=lastDP.date.getFullYear(),m=lastDP.date.getMonth(),day=lastDP.date.getDate();
  const sameLastDay=d.filter(x=>x.date.getFullYear()===y&&x.date.getMonth()===m&&x.date.getDate()===day);
  const totalDPDate=sameLastDay.reduce((s,x)=>s+x.amount,0);

  const latestWD=w.slice().sort((a,b)=>b.date-a.date)[0];
  const totalWD=w.reduce((s,x)=>s+x.wdRaw*1000,0);

  const net=totalDP-totalWD-bonus;
  const status=net>0?"WIN":net<0?"LOSE":"BALANCE";

  DATA.hasil=`BOLAPELANGI2

USER ID : ${user}
WD : ${displayed(latestWD.wdRaw)}
SISA DANA AKUN : ${displayed(latestWD.newRaw)}

LAST DP : ${fmt(lastDP.amount)}
${lastDP.dateText}
TOTAL DP : ${fmt(totalDPDate)}

STATUS MEMBER
DP : ${fmt(totalDP)}
WD : ${fmt(totalWD)}
BONUS : ${fmt(bonus)}
DP-WD-BNS : ${fmt(net)}
STATUS KITA : ${status}

GAMES :
MEMBER REGISTER :`;

  const pack=(rows,label)=>{
    if(!rows.length)return ["Tidak ada data "+label+"."];
    const sorted=rows.slice().sort((a,b)=>a.date-b.date);
    const arr=[`TOTAL ${label}: ${fmt(sorted.reduce((a,x)=>a+x.amount,0))}`];
    sorted.forEach((x,i)=>arr.push(`${i+1}. ${fmt(x.amount)} — ${x.dateText}`));
    return arr;
  };
  DATA.DP=pack(ordinary,"DP");
  DATA.A=pack(A,"SCB A");
  DATA.B=pack(B,"SCB B");
  DATA.C=pack(C,"SCB C");
  DATA.D=pack(D,"SCB D");
  DATA.E=pack(E,"SCB E");
  DATA.WD=w.slice().sort((a,b)=>a.date-b.date).map((x,i)=>`${i+1}. WD ${displayed(x.wdRaw)} → ${fmt(x.wdRaw*1000)}`);

  // ===== COPY: NOMINAL ONLY =====
  COPY.DP=ordinary.slice().sort((a,b)=>a.date-b.date).map(x=>fmt(x.amount));
  COPY.A=A.slice().sort((a,b)=>a.date-b.date).map(x=>fmt(x.amount));
  COPY.B=B.slice().sort((a,b)=>a.date-b.date).map(x=>fmt(x.amount));
  COPY.C=C.slice().sort((a,b)=>a.date-b.date).map(x=>fmt(x.amount));
  COPY.D=D.slice().sort((a,b)=>a.date-b.date).map(x=>fmt(x.amount));
  COPY.E=E.slice().sort((a,b)=>a.date-b.date).map(x=>fmt(x.amount));
  COPY.WD=w.slice().sort((a,b)=>a.date-b.date).map(x=>fmt(x.wdRaw*1000));

  $("stats").innerHTML=`
    <div><span>DP BIASA</span><b>${ordinary.length}</b></div>
    <div><span>SCB</span><b>${A.length+B.length+C.length+D.length+E.length}</b></div>
    <div><span>WD</span><b>${w.length}</b></div>
    <div><span>STATUS</span><b>${status}</b></div>`;

  show("hasil");
}

function show(t){
  cur=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.t===t));
  $("out").textContent=t==="hasil"?DATA.hasil:(DATA[t]||[]).join("\n")||"Tidak ada data.";
}

/* ===== EVENTS ===== */
$("process").onclick=()=>{try{processData()}catch(e){$("error").textContent=e.message;$("error").classList.add("show")}};

$("clear").onclick=()=>{
  $("dp").value="";$("wd").value="";$("out").textContent="Belum ada hasil.";
  $("error").classList.remove("show");
  DATA={hasil:"",DP:[],A:[],B:[],C:[],D:[],E:[],WD:[]};
  COPY={DP:[],A:[],B:[],C:[],D:[],E:[],WD:[]};
  $("stats").innerHTML=`<div><span>DP BIASA</span><b>—</b></div><div><span>SCB</span><b>—</b></div><div><span>WD</span><b>—</b></div><div><span>STATUS</span><b>—</b></div>`;
};

// COPY: HASIL = full text, tab lain = nominal only
$("copy").onclick=()=>{
  const t = cur==="hasil" ? DATA.hasil : (COPY[cur]||[]).join("\n");
  navigator.clipboard.writeText(t).then(()=>{
    const b=$("copy");
    b.textContent="TERCOPY!";
    setTimeout(()=>b.textContent="COPY TAB INI",900);
  });
};

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.t));
</script>
</body>
</html>
